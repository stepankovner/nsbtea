# Проверки на каждый push и pull request: линтеры, типы, тесты, сборка образов.
# Те же команды, что в CLAUDE.md, — локально и в CI одинаково.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nsb
          POSTGRES_PASSWORD: nsb
          POSTGRES_DB: nsbtea_test
          TZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nsb -d nsbtea_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://nsb:nsb@localhost:5432/nsbtea_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check app tests
      - name: ruff format --check
        run: uv run ruff format --check app tests
      - name: mypy
        run: uv run mypy app tests
      - name: pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (lint, typecheck, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: pnpm install --frozen-lockfile
      - name: Типы API совпадают с backend
        run: |
          (cd ../backend && uv python install 3.12 && uv sync --frozen --no-dev)
          pnpm check:api
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: vitest
        run: pnpm test
      - name: build
        run: pnpm build

  e2e:
    name: Docker Compose + сквозные тесты (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OWNER_PASSWORD: e2e-owner-password-123
    steps:
      - uses: actions/checkout@v5
      - name: .env для тестового запуска
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^ENVIRONMENT=.*/ENVIRONMENT=staging/' \
            -e "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" \
            -e 's|^PUBLIC_BASE_URL=.*|PUBLIC_BASE_URL=https://localhost|' \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
            .env
      - name: Сборка и запуск всех сервисов
        working-directory: infra
        run: |
          docker compose --env-file ../.env config -q
          docker compose --env-file ../.env up -d --build
          timeout 180 sh -c 'until [ "$(docker inspect -f {{.State.Health.Status}} nsbtea-web-1 2>/dev/null)" = healthy ]; do sleep 3; done'
      - name: Начальные данные и владелец
        working-directory: infra
        run: |
          C="docker compose --env-file ../.env exec -T api python -m app.cli"
          $C seed
          $C demo-data
          printf '%s\n%s\n' "$OWNER_PASSWORD" "$OWNER_PASSWORD" | $C create-owner --email owner@nsbtea.ru --name "Владелец"
      - name: Проверка после запуска (smoke-test.sh)
        working-directory: infra
        run: ./smoke-test.sh https://localhost
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Playwright
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Сквозные тесты (телефон 375 px и ноутбук 1440 px)
        working-directory: frontend
        env:
          E2E_BASE_URL: https://localhost
          E2E_OWNER_EMAIL: owner@nsbtea.ru
          E2E_OWNER_PASSWORD: ${{ env.OWNER_PASSWORD }}
        run: pnpm e2e
      - name: Логи сервисов при ошибке
        if: failure()
        working-directory: infra
        run: docker compose --env-file ../.env logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
