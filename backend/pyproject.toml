[project]
name = "nsbtea-backend"
version = "0.1.0"
description = "НСБ Чай — backend интернет-магазина"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "arq>=0.26",
    "redis>=5.0",
    "aiogram>=3.15",
    "pillow>=11.0",
    "boto3>=1.35",
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
    "sentry-sdk[fastapi]>=2.18",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "boto3-stubs[s3]>=1.35",
    "asgi-lifespan>=2.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT", "DTZ", "TID", "PL"]
ignore = [
    "S101",    # assert в тестах
    "PLR0913", # много аргументов — норма для сервисов
    "PLR2004", # «магические» числа в тестах и константах домена
    "RUF001", "RUF002", "RUF003", # кириллица в строках/комментариях — ожидаема
    "PLR0911", "PLR0912", "PLR0915",
    "B008",    # Depends() в аргументах FastAPI
    "PLR0917", # позиционные аргументы — в домене почти всегда keyword-only
    "PLC0415", # ленивые импорты тяжёлых интеграций — осознанно
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR0913", "DTZ001", "S311"]
"migrations/**" = ["N999"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["arq.*", "aiosmtplib.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:aiogram.*"]
